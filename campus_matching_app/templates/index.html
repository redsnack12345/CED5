<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>교내 실시간 활동 매칭</title><link rel="stylesheet" href="/static/style.css"></head>
<body>
<header><div><h1>내 시간표</h1><p>공강을 선택해 교내 활동을 찾아보세요.</p></div>
<nav><button id="prevWeek">‹</button><b id="weekLabel">시간표</b><button id="nextWeek">›</button></nav></header>
<main><div class="legend"><span>🟦 수업</span><span>⬜ 공강</span><span>🟩 참여한 활동</span></div>
<div class="table-wrap"><table id="timetable"><thead><tr><th>교시</th></tr></thead><tbody></tbody></table></div>
<p class="hint">비어 있는 시간대를 클릭하면 방 생성 또는 방 찾기를 할 수 있습니다.</p></main>
<div class="backdrop" id="backdrop"><section class="modal"><div class="modal-head"><h2 id="modalTitle"></h2><button id="close">×</button></div><div id="modalBody" class="modal-body"></div></section></div>
<script src="/static/app.js"></script></body></html>
