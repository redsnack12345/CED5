<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CampusMate | 관리 데모</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f5fc;color:#252640;font:16px system-ui,sans-serif}main{max-width:900px;margin:auto;padding:32px 18px}h1{margin:0;color:#6264bd;letter-spacing:-1px}p{color:#73748a}header,.panel{background:white;border:1px solid #e2e1ef;border-radius:20px;padding:22px;margin-bottom:18px}header{display:flex;flex-wrap:wrap;align-items:center;gap:12px}header label{font-weight:700}select,button{font:inherit;border:1px solid #d9d8e9;border-radius:10px;padding:9px 13px;background:white;color:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}button.primary,button.active{background:#7476cd;color:white;border-color:#7476cd}button.danger{color:#b43d50;border-color:#efcbd1}nav{display:flex;gap:8px;margin:18px 0}nav button{flex:1}h2{margin:0 0 12px;font-size:21px}h3{font-size:16px;margin:20px 0 8px}.member{display:flex;align-items:center;gap:8px;padding:13px 0;border-bottom:1px solid #efedf5;flex-wrap:wrap}.identity{flex:1;min-width:110px}.avatar{display:inline-grid;place-items:center;background:#eeedfb;color:#6264bd;border-radius:50%;width:36px;height:36px;font-weight:700}.muted{font-size:13px;color:#77788f}.progress{height:8px;border-radius:8px;background:#edecf5;overflow:hidden;margin:12px 0}.progress div{height:100%;background:#8183dc}.count{font-size:30px;font-weight:750}#status{padding:12px 16px;border-radius:10px;background:#e8f4eb;color:#28623b;min-height:45px}#status.error{background:#fff0f1;color:#a12c3d}.empty{color:#85859b;padding:10px 0}footer{font-size:13px;color:#77788f;margin-top:16px} [hidden]{display:none!important}
</style></head><body><main><h1>CampusMate</h1><p>참여자 및 친구 관리 · 독립 웹 데모</p><header><label for="actor">현재 사용자</label><select id="actor"><option value="1">김민수 (방장)</option><option value="2">이지훈</option><option value="3">박서연</option><option value="4">최유진</option></select><button id="reset">초기화</button></header><nav aria-label="관리 메뉴"><button id="roomTab" class="active">참여자 관리</button><button id="friendTab">친구 및 차단 관리</button></nav><section class="panel" id="room"><h2>점심 같이 먹어요</h2><div class="count" id="count"></div><div class="progress"><div id="bar"></div></div><div id="role" class="muted"></div><h3>참여자 목록</h3><div id="members"></div></section><section class="panel" id="friend" hidden><h2>친구 및 차단 관리</h2><h3>내 친구</h3><div id="friends"></div><h3>다른 사용자</h3><div id="users"></div><h3>차단 목록</h3><div id="blocks"></div></section><div id="status" role="status" aria-live="polite">불러오는 중...</div><footer>가상 사용자 4명 · 메모리 저장 · 실제 로그인과 연결되지 않은 로컬 테스트 화면</footer></main>
<script>
const $=id=>document.getElementById(id); let busy=false;
function message(text,error=false){$('status').textContent=text;$('status').classList.toggle('error',error)}
async function run(action='view',target=null){if(busy)return;busy=true;$('actor').disabled=true;try{const res=await fetch('/api/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({actor:Number($('actor').value),action,target})});const data=await res.json();if(!res.ok)throw new Error(data.error||'요청 실패');render(data);message(({view:'사용자를 선택하고 기능을 테스트하세요.',reset:'초기화 완료',kick:'참여자를 추방했습니다.',add_friend:'친구를 추가했습니다.',remove_friend:'친구를 삭제했습니다.',block_user:'사용자를 차단했습니다.',unblock_user:'차단을 해제했습니다.'})[action]);}catch(e){message(e.message,true)}finally{busy=false;$('actor').disabled=false}}
function row(parent,id,name,role,actions){const el=document.createElement('div');el.className='member';const avatar=document.createElement('span');avatar.className='avatar';avatar.textContent=name[0];el.append(avatar);const identity=document.createElement('div');identity.className='identity';identity.textContent=name;const sub=document.createElement('div');sub.className='muted';sub.textContent='ID '+id+(role?' · '+role:'');identity.append(sub);el.append(identity);for(const [label,action,danger,disabled] of actions){const btn=document.createElement('button');btn.textContent=label;btn.disabled=!!disabled;btn.className=danger?'danger':'primary';btn.onclick=()=>{if(action==='kick'&&!confirm(name+'님을 추방할까요?'))return;run(action,id)};el.append(btn)}parent.append(el)}
function list(id,ids,data,actions,role=()=> ''){const parent=$(id);parent.replaceChildren();if(!ids.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='목록이 비어 있습니다.';parent.append(empty)}for(const uid of ids)row(parent,uid,data.users[uid],role(uid),actions(uid))}
function render(d){const a=Number($('actor').value);$('count').textContent=d.members.length+' / '+d.capacity+'명';$('bar').style.width=(d.members.length/d.capacity*100)+'%';$('role').textContent='내 역할: '+(a===d.owner?'방장':d.members.includes(a)?'참여자':'미참여');list('members',d.members,d,u=>a===d.owner&&u!==d.owner?[['추방','kick',true]]:[],u=>u===d.owner?'방장':'참여자');list('friends',d.friends,d,()=>[['삭제','remove_friend',false],['차단','block_user',true]]);list('users',Object.keys(d.users).map(Number).filter(u=>u!==a&&!d.blocks.includes(u)),d,u=>[['친구 추가','add_friend',false,d.friends.includes(u)],['차단','block_user',true]]);list('blocks',d.blocks,d,()=>[['차단 해제','unblock_user',false]])}
function tab(isRoom){$('room').hidden=!isRoom;$('friend').hidden=isRoom;$('roomTab').classList.toggle('active',isRoom);$('friendTab').classList.toggle('active',!isRoom)}$('actor').onchange=()=>run();$('reset').onclick=()=>{if(confirm('모든 데모 데이터를 초기화할까요?')){$('actor').value='1';run('reset')}};$('roomTab').onclick=()=>tab(true);$('friendTab').onclick=()=>tab(false);run();
</script></body></html>
