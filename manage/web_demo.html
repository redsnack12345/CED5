<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CampusMate | 친구 관리</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5fb;color:#252640;font:15px system-ui,sans-serif}main{max-width:880px;margin:auto;padding:32px 18px}h1{margin:0;color:#6264bd;font-size:30px;letter-spacing:-1px}p,.muted{color:#73748a}.muted{font-size:13px}header,.panel{background:white;border:1px solid #e2e1ef;border-radius:18px;padding:22px;margin-bottom:16px}header,nav,.toolbar,.member{display:flex;gap:10px;align-items:center;flex-wrap:wrap}header label{font-weight:700}select,button,input{font:inherit;border:1px solid #d9d8e9;border-radius:9px;padding:10px 13px;background:white;color:inherit}input{flex:1;min-width:150px}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}button.primary,button.active{background:#6264bd;color:white;border-color:#6264bd}button.danger{color:#b43d50;border-color:#efcbd1}nav{margin:16px 0}nav button{flex:1}h2{margin:0 0 12px;font-size:22px}h3{font-size:16px;margin:24px 0 8px}.member{padding:13px 0;border-bottom:1px solid #efedf5}.identity{flex:1;min-width:110px}.avatar{display:grid;place-items:center;background:#eeedfb;color:#6264bd;border-radius:50%;width:38px;height:38px;font-weight:700}.empty{color:#73748a;padding:12px 0}.count{font-size:30px;font-weight:750}.progress{height:8px;background:#edecf5;border-radius:8px;overflow:hidden;margin:12px 0}.progress div{height:100%;background:#8183dc}#status{padding:12px 16px;background:#e8f4eb;color:#28623b;border-radius:10px}#status.error{background:#fff0f1;color:#a12c3d}.subnav{border-bottom:1px solid #e2e1ef;padding-bottom:12px}footer{font-size:13px;color:#77788f;margin-top:16px}[hidden]{display:none!important}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #aaaaf0;outline-offset:2px}
</style></head><body><main><h1>CampusMate</h1><p>참여자 및 친구 관리 · 독립 웹 데모</p><header><label for="actor">현재 사용자</label><select id="actor"><option value="1">김민수 (방장)</option><option value="2">이지훈</option><option value="3">박서연</option><option value="4">최유진</option></select><button id="reset">초기화</button></header><nav><button id="roomTab" class="active">참여자 관리</button><button id="friendTab">친구 관리</button></nav>
<section class="panel" id="room"><h2>점심 같이 먹어요</h2><div class="count" id="count"></div><div class="progress"><div id="bar"></div></div><div class="toolbar"><span id="role" class="muted"></span><button id="leave" class="danger" hidden>방 나가기</button></div><h3>참여자 목록</h3><div id="members"></div></section>
<section class="panel" id="friend" hidden><h2>친구 관리</h2><nav class="subnav" id="subnav"><button data-tab="find" class="active">친구 찾기</button><button data-tab="friendsPane" id="friendsTab">내 친구</button><button data-tab="receivedPane" id="receivedTab">받은 요청</button><button data-tab="sentPane" id="sentTab">보낸 요청</button><button data-tab="blocksPane">차단 관리</button></nav>
<section id="find"><h3>같은 매칭방 추천</h3><div id="recommended"></div><h3>전체 사용자 검색</h3><form id="searchForm" class="toolbar"><input id="keyword" aria-label="닉네임 또는 ID" placeholder="닉네임 또는 사용자 ID" maxlength="100"><button type="submit" class="primary">검색</button><button type="button" id="clear">지우기</button></form><div id="results"></div></section>
<section id="friendsPane" hidden><h3>내 친구</h3><div id="friends"></div></section><section id="receivedPane" hidden><h3>받은 요청</h3><div id="received"></div></section><section id="sentPane" hidden><h3>보낸 요청</h3><div id="sent"></div></section><section id="blocksPane" hidden><h3>차단 목록</h3><div id="blocks"></div></section></section><div id="status" role="status" aria-live="polite">불러오는 중...</div><footer>가상 사용자 4명 · 메모리 저장 · 실제 로그인과 연결되지 않은 로컬 테스트 화면</footer></main>
<script>
const $=id=>document.getElementById(id);let busy=false,keyword='';
function message(text,error=false){$('status').textContent=text;$('status').classList.toggle('error',error)}
async function run(action='view',target=null){if(busy)return;busy=true;$('actor').disabled=true;try{const res=await fetch('/api/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({actor:Number($('actor').value),action,target,keyword})});const d=await res.json();if(!res.ok)throw new Error(d.error||'요청 실패');render(d);message(d.message)}catch(e){message(e.message,true)}finally{busy=false;$('actor').disabled=false}}
function row(parent,id,name,role,actions){const el=document.createElement('div');el.className='member';const avatar=document.createElement('span');avatar.className='avatar';avatar.textContent=name[0];el.append(avatar);const identity=document.createElement('div');identity.className='identity';identity.textContent=name;const sub=document.createElement('div');sub.className='muted';sub.textContent='ID '+id+(role?' · '+role:'');identity.append(sub);el.append(identity);for(const [label,action,danger,disabled] of actions){const btn=document.createElement('button');btn.textContent=label;btn.disabled=!!disabled;btn.className=danger?'danger':'primary';btn.onclick=()=>{if(['kick','block_user','remove_friend'].includes(action)&&!confirm(name+'님: '+label+'할까요?'))return;run(action,id)};el.append(btn)}parent.append(el)}
function list(id,ids,d,actions,role=()=>'',empty='목록이 비어 있습니다.'){const parent=$(id);parent.replaceChildren();if(!ids.length){const el=document.createElement('div');el.className='empty';el.textContent=empty;parent.append(el)}for(const uid of ids)row(parent,uid,d.users[uid],role(uid),actions(uid))}
function render(d){const a=Number($('actor').value),received=d.received.map(x=>x.user_id),sent=d.sent.map(x=>x.user_id);$('count').textContent=d.members.length+' / '+d.capacity+'명';$('bar').style.width=d.members.length/d.capacity*100+'%';$('role').textContent='내 역할: '+(a===d.owner?'방장':d.members.includes(a)?'참여자':'미참여');$('leave').hidden=a===d.owner||!d.members.includes(a);$('receivedTab').textContent='받은 요청 ('+received.length+')';$('sentTab').textContent='보낸 요청 ('+sent.length+')';$('friendsTab').textContent='내 친구 ('+d.friends.length+')';list('members',d.members,d,u=>a===d.owner&&u!==d.owner?[['추방','kick',true]]:[],u=>u===d.owner?'방장':'참여자');const candidate=u=>d.friends.includes(u)?[['친구','',false,true]]:sent.includes(u)?[['요청 취소','cancel_friend_request',false]]:received.includes(u)?[['수락','accept_friend_request',false],['거절','reject_friend_request',true]]:[['친구 요청','send_friend_request',false],['차단','block_user',true]];list('recommended',d.recommended.map(x=>x.user_id),d,candidate,()=>'', '같은 방 추천 대상이 없습니다.');list('results',d.results.map(x=>x.user_id),d,candidate,()=>'',keyword?'검색 결과가 없습니다.':'닉네임 또는 ID를 입력해 검색하세요.');list('friends',d.friends,d,()=>[['삭제','remove_friend',true],['차단','block_user',true]]);list('received',received,d,()=>[['수락','accept_friend_request',false],['거절','reject_friend_request',true],['차단','block_user',true]]);list('sent',sent,d,()=>[['요청 취소','cancel_friend_request',true],['차단','block_user',true]],()=> '수락 대기 중');list('blocks',d.blocks,d,()=>[['차단 해제','unblock_user',false]])}
function tab(room){$('room').hidden=!room;$('friend').hidden=room;$('roomTab').classList.toggle('active',room);$('friendTab').classList.toggle('active',!room)}
$('subnav').querySelectorAll('button').forEach(b=>b.onclick=()=>{$('subnav').querySelectorAll('button').forEach(x=>{x.classList.toggle('active',x===b);$(x.dataset.tab).hidden=x!==b})});$('actor').onchange=()=>{keyword='';$('keyword').value='';run()};$('reset').onclick=()=>{if(!busy&&confirm('모든 데모 데이터를 초기화할까요?')){keyword='';$('keyword').value='';$('actor').value='1';run('reset')}};$('leave').onclick=()=>{if(confirm('방에서 나갈까요?'))run('leave')};$('roomTab').onclick=()=>tab(true);$('friendTab').onclick=()=>{tab(false);run()};$('searchForm').onsubmit=e=>{e.preventDefault();if(!busy){keyword=$('keyword').value.trim();run('search')}};$('clear').onclick=()=>{if(!busy){keyword='';$('keyword').value='';run('search')}};run();
</script></body></html>
